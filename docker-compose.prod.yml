# HireLoop — Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# WARNING: This is a reference deployment. In production you should:
#  - Use Docker Swarm or Kubernetes for orchestration
#  - Store secrets in a vault (HashiCorp Vault, AWS Secrets Manager, etc.)
#  - Use a managed Postgres service (Supabase, RDS, etc.)
#  - Add a reverse proxy (Caddy, Nginx, Traefik) with TLS

services:
  # ─── API (FastAPI) ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEV_SQLITE=${DEV_SQLITE:-1}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
    env_file:
      - path: ./apps/api/.env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    volumes:
      - hireloop-api-data:/app/data

  # ─── Web (Next.js) ────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    env_file:
      - path: ./apps/web/.env.local
        required: false
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ─── Prometheus (metrics collection) ──────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped

volumes:
  hireloop-api-data:
