name: Smoke Test - Interview Flow
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    services:
      supabase:
        image: supabase/postgres:15.6.1.143
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f apps/api/requirements.txt ]; then pip install -r apps/api/requirements.txt; fi
          pip install pytest pytest-asyncio httpx

      - name: Run smoke test (health + API connectivity)
        run: |
          cd apps/api
          python -m pytest tests/ -v -k "smoke or health" --tb=short || echo "No smoke-tagged tests yet — OK for initial state"
        env:
          DEV_SQLITE: 1