version: 2
updates:
  # npm dependencies (web frontend)
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - frontend
    assignees:
      - aj-codespy
    reviewers:
      - aj-codespy

  # npm dependencies (root - presentation tooling)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - tools

  # pip dependencies (API backend)
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - backend
    assignees:
      - aj-codespy
    reviewers:
      - aj-codespy

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci