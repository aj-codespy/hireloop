# Prometheus configuration for HireLoop monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "alerts.yml"

scrape_configs:
  - job_name: "hireloop-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/v1/health"
    # Note: Replace with /metrics endpoint once instrumented
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.*)"
        replacement: "hireloop-api-$1"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
